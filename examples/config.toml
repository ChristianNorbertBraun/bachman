# ~/.config/bachman/config.toml

[update]                         # optional: lets `bachman update` install your releases
repo = "your-name/bachman"       # where the releases are
publisher = "your-github-login"  # only releases published by this login are installed

[agenda]                         # optional: the planning document for `podcast_get_agenda`
document = "https://docs.google.com/document/d/your-document-id/edit"
# start = "START"   # a line starting with this opens an episode in preparation ("START <topic>") ...
# end = "END"       # ... and a line that is exactly this closes it
# max_recent_episodes = 4          # with several marked episodes, list the topics of this many by default
# sort_direction = "newest_first"  # the newest marked episode is at the top; "oldest_first" if it is at the bottom
# template_start = "TEMPLATE"    # the lines between these two marker lines are copied
# template_end = "TEMPLATE END"  # when a new episode is added

[connectors.trello]              # optional: switches the Trello connector on (tools trello_...)
board = "https://trello.com/b/your-board/name"   # the board used when a tool names none
write = true                     # also offer create, move, update and comment (default: false)

[connectors.discord]             # optional: switches the Discord connector on (tools discord_...)
channel = "123456789012345678"   # the id of the text channel the threads are started in
write = true                     # also offer discord_create_thread to the chat agent (default: false)

[announce]                       # optional: start a thread named like the episode when it is out (needs the timer)
# connector = "discord"          # which Discord instance posts
# message = "Spotify: {spotify}\nYouTube: {youtube}"   # first message; a line whose link is missing is left out
# min_minutes = 5                # shorter episodes are treated as test uploads
# youtube_wait_minutes = 60      # wait this long for the video, then post without its link

# [connectors.devboard]          # a second Trello with its own key and token (tools devboard_...)
# type = "trello"

# [clients.anton]                # limit the chat client with the token file token-anton
# tools = ["devboard"]           # connector instances, "podcast", "bachman"; clients not listed here may use everything

# [server]
# port = 8766                    # another port for a second instance on the same machine

[publish]                        # optional: rules for the tools that write to a platform
timezone = "Europe/Berlin"       # publish times without an offset are meant in this zone (default UTC)
forbidden = ["–", "—"]           # characters or words that titles and descriptions must not contain
